name: Validacao final sem deploy

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'package*.json'
      - '.github/workflows/final-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: final-validation
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Testes, Astro check, build, rotas e preservacao
        run: node scripts/final-validation.mjs
      - name: Instalar ferramentas de navegador isoladas do projeto
        run: |
          npm install --prefix "$RUNNER_TEMP/elo-browser" --no-audit --no-fund playwright@1.56.1 leaflet@1.9.4
          "$RUNNER_TEMP/elo-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Interacoes, responsividade, GLB e SOS em navegador
        env:
          BROWSER_TOOLS: ${{ runner.temp }}/elo-browser
        run: node scripts/browser-validation.mjs
      - name: Guardar evidencias sem publicar
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validacao-final
          path: |
            docs/final-validation.json
            validation-logs/
            validation-screenshots/
          if-no-files-found: error
      - name: Versionar somente o relatorio compacto
        if: always()
        run: |
          if test -f docs/final-validation.json; then
            cp docs/final-validation.json "$RUNNER_TEMP/elo-final-report.json"
            git fetch origin main
            git checkout -B main origin/main
            mkdir -p docs
            cp "$RUNNER_TEMP/elo-final-report.json" docs/final-validation.json
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/final-validation.json
            if ! git diff --cached --quiet; then
              git commit -m "chore: registra resultados reais da validacao final"
              git push origin HEAD:main
            fi
          fi
