name: Revisao sem publicacao
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run check
      - run: npm run build
      - run: node scripts/check-dist.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependencias-revisao
          path: |
            package-lock.json
            ~/.npm/_logs/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: build-revisao
          path: dist/
